<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>nvim-regie</title>
  <link rel="stylesheet" href="/vendor/xterm/css/xterm.css">
  <link rel="stylesheet" href="/vendor/highlight/styles/github-dark.min.css">
  <style>
    :root { --bg: #1e1e1e; --panel: #252526; --fg: #ddd; --muted: #8a8a8a; --accent: #4fa3ff; --err: #ff6b6b; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
    body { display: flex; flex-direction: column; }
    [hidden] { display: none !important; }
    header { display: flex; gap: .5rem; padding: .5rem; align-items: center; border-bottom: 1px solid #333; }
    header a { color: var(--accent); text-decoration: none; }
    #sess { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    #dash { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .75rem; padding: .75rem; overflow-y: auto; align-items: start; }
    .col > h2 { font-size: .95rem; margin: 0 0 .5rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .col > h2 .n { margin-left: .4rem; color: var(--fg); }
    .col.needs_you > h2 { color: #f59e0b; }
    .card { background: var(--panel); border: 1px solid #333; border-left: 4px solid #555; border-radius: 4px; padding: .5rem .65rem; margin-bottom: .5rem; cursor: pointer; }
    .card[data-state="running"] { border-left-color: #4fa3ff; }
    .card[data-state="needs_you"] { border-left-color: #f59e0b; }
    .card[data-state="error"] { border-left-color: var(--err); }
    .card[data-state="done_unread"] { border-left-color: #22c55e; }
    .card.selected { outline: 2px solid var(--accent); }
    .card .head { display: flex; gap: .5rem; align-items: baseline; }
    .card .proj { font-weight: 600; }
    .card .branch { color: var(--muted); font-size: .85em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card .dur { margin-left: auto; color: var(--muted); font-size: .85em; white-space: nowrap; }
    .card .label { font-size: .85em; color: var(--muted); }
    .card .act { font: .85em Consolas, monospace; margin-top: .25rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card .bg { font-size: .85em; margin-top: .25rem; color: #7fb8ff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card .bg.warn { color: #f59e0b; }
    .card .draft { font-size: .85em; margin-top: .25rem; color: #c4a1ff; }
    .card .exc { font-size: .85em; margin-top: .25rem; color: #bbb; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    @media (max-width: 900px) { #dash { grid-template-columns: 1fr; } }
    #interrupt:not(:disabled) { background: #b45309; color: #fff; }
    #model { padding: 0 .5rem; border-radius: .6rem; border: 1px solid #555; color: #d9c8a0; font-size: .9em; }
    #model[hidden] { display: none; }
    #state { margin-left: auto; padding: 0 .5rem; border-radius: .6rem; background: #333; }
    #state[data-state="running"] { background: #1f4d7a; }
    #state[data-state="needs_you"] { background: #b45309; font-weight: bold; }
    #state[data-state="done_unread"] { background: #166534; }
    #state[data-state="error"] { background: #991b1b; }
    #status { opacity: .7; }
    #offline { padding: .6rem 1rem; background: #991b1b; color: #fff; font-weight: bold; text-align: center; }
    body.offline #dash, body.offline #sess { opacity: .35; pointer-events: none; filter: grayscale(1); }
    #conv { flex: 1; min-height: 0; overflow-y: auto; padding: 1rem max(1rem, calc((100% - 60rem) / 2)); }
    .msg { margin: 0 0 1rem; }
    .msg.user > .body { background: var(--panel); border-left: 3px solid var(--accent); padding: .5rem .75rem; border-radius: 4px; white-space: pre-wrap; }
    .msg.assistant > .body > * { margin-top: 0; }
    .msg.user.pending > .body { opacity: .65; border-left-style: dashed; }
    .md pre { background: #111; padding: .6rem .8rem; border-radius: 4px; overflow-x: auto; }
    .md code { font-family: Consolas, monospace; font-size: .9em; }
    .md :not(pre) > code { background: #333; padding: .1em .3em; border-radius: 3px; }
    .md table { border-collapse: collapse; }
    .md th, .md td { border: 1px solid #444; padding: .25rem .5rem; }
    .md a { color: var(--accent); }
    details.tool, details.think { margin: .35rem 0; border: 1px solid #333; border-radius: 4px; background: var(--panel); }
    details > summary { cursor: pointer; padding: .25rem .5rem; color: var(--muted); font-size: .9em; }
    details.tool > summary .name { color: var(--fg); font-weight: 600; margin-right: .5rem; }
    details.tool.error > summary { color: var(--err); }
    details pre { margin: 0; padding: .5rem; overflow-x: auto; white-space: pre-wrap; word-break: break-word; font: .85em Consolas, monospace; border-top: 1px solid #333; }
    details pre.result.error { color: var(--err); }
    #picker { flex: 1; min-height: 0; overflow-y: auto; padding: 1rem max(1rem, calc((100% - 40rem) / 2)); }
    #picker[hidden] { display: none; }
    #picker h2 { margin: 0 0 .75rem; font-size: 1.1rem; }
    #picker .opt { display: flex; gap: .75rem; align-items: baseline; width: 100%; text-align: left; background: var(--panel); border: 1px solid #333; border-radius: 4px; padding: .5rem .65rem; margin-bottom: .4rem; color: var(--fg); cursor: pointer; font: inherit; }
    #picker .opt:hover, #picker .opt:focus { outline: 2px solid var(--accent); }
    #picker .opt .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #picker .opt .ago { color: var(--muted); font-size: .85em; white-space: nowrap; }
    #picker .opt.new { border-left: 4px solid var(--accent); font-weight: 600; }
    #picker .empty { color: var(--muted); margin: .5rem 0; }
    #picker .form { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; margin-bottom: .6rem; }
    #picker .form input[type="text"] { background: var(--panel); color: var(--fg); border: 1px solid #333; border-radius: 4px; padding: .3rem .5rem; font: inherit; width: 10rem; }
    #picker .warn { color: #f59e0b; font-size: .9em; margin: 0 0 .6rem; }
    #picker h3 { margin: 1.1rem 0 .5rem; font-size: .95rem; color: var(--muted); font-weight: 600; width: 100%; }
    #picker .form.chantier h3 { margin: 0; }
    #picker .form.chantier input[type="text"] { width: 16rem; }
    #picker .form.chantier .opt { width: auto; margin: 0; }
    #picker .opt.danger { border-left: 4px solid #ef4444; width: auto; margin-top: 1rem; }
    #picker .open-tag { color: var(--accent); font-size: .85em; white-space: nowrap; }
    #cand-dlg { background: #1e1e1e; color: var(--fg); border: 1px solid #555; border-radius: .5rem; max-width: 40rem; width: 90vw; max-height: 80vh; overflow: auto; }
    #cand-dlg::backdrop { background: rgba(0, 0, 0, .6); }
    #cand-dlg .opt { display: block; width: 100%; text-align: left; margin: .25rem 0; }
    #cand-dlg .opt .p { display: block; color: var(--muted); font-size: .85em; }
    #cand-dlg .row { display: flex; gap: .5rem; margin-top: .75rem; }
    #cand-dlg h2.danger { color: var(--err); }
    #cand-dlg .opt.danger { background: var(--err); color: #fff; font-weight: 600; }
    #cand-dlg .warn { color: #f59e0b; }
    .card .remove { font-size: .75em; padding: 0 .4rem; opacity: .45; }
    .card:hover .remove, .card .remove:focus { opacity: 1; }
    .card .remove:hover { color: var(--err); border-color: var(--err); }
    .card .note { margin-top: .35rem; border-top: 1px solid #333; padding-top: .25rem; font-size: .85em; color: #bbb; }
    .card .note .nx { white-space: pre-line; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .card .note button { margin-top: .2rem; font-size: .85em; }
    .card .note .full { max-height: 16rem; overflow: auto; color: var(--fg); }
    .card .tag, #tabs a .tag { font-size: .8em; padding: 0 .4rem; border-radius: .5rem; background: #333; color: var(--fg); white-space: nowrap; }
    .card .tag.consult, #tabs a .tag.consult { background: #3b3366; }
    #tabs { display: flex; gap: .25rem; }
    #tabs[hidden] { display: none; }
    #tabs a { color: var(--muted); text-decoration: none; padding: .1rem .5rem; border-radius: 4px; border: 1px solid #333; font-size: .9em; }
    #tabs a.on { color: var(--fg); border-color: var(--accent); }
    #tabs a[data-state="needs_you"] { border-color: #f59e0b; }
    #tabs a[data-state="done_unread"] { border-color: #22c55e; }
    .turn { margin: -.5rem 0 1rem; color: var(--muted); font: .85em Consolas, monospace; }
    .turn.live { color: #d97757; }
    /* Zone de travail : conversation + colonne Neovim, en bas (défaut) ou à droite (body.nvim-right). */
    #work { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    #side { flex: none; display: flex; flex-direction: column; gap: .4rem; padding: .25rem max(1rem, calc((100% - 60rem) / 2)) .75rem; }
    #statusline { flex: none; padding: .2rem .6rem; font: .85em Consolas, monospace; white-space: pre; overflow: hidden; text-overflow: ellipsis; background: var(--panel); border: 1px solid #333; border-radius: 6px; }
    #statusline[hidden] { display: none; }
    #nvim { height: 16rem; flex: none; box-sizing: border-box; padding: .5rem .6rem; background: #000; border: 1px solid #3a3a3a; border-radius: 8px; }
    #nvim:focus-within { border-color: var(--accent); }
    #nvim-term { height: 100%; }
    body.nvim-right #work { flex-direction: row; }
    /* Deux moitiés. Le padding en % se calcule sur la largeur du parent (#work, toute la page) :
       le centrage du mode bas écrasait le texte à droite, d'où un padding fixe ici. */
    body.nvim-right #conv, body.nvim-right #picker { flex: 1 1 50%; min-width: 0; padding: 1rem 1.5rem; }
    body.nvim-right #side { flex: 1 1 50%; min-width: 0; padding: .75rem .75rem .75rem 0; }
    body.nvim-right #nvim { flex: 1; height: auto; min-height: 0; }
    #drawer { display: none; height: 40vh; border-top: 2px solid #444; padding: .25rem .5rem; box-sizing: border-box; }
    #drawer.open { display: block; }
    #term { height: 100%; }
  </style>
</head>
<body>
  <header>
    <a id="back" href="#/" hidden>← Tableau de bord</a>
    <strong id="proj-name"></strong>
    <nav id="tabs" hidden></nav>
    <button id="addproj-btn" title="Suivre un autre dossier, parmi ceux où claude a déjà été lancé">+ Dossier</button>
    <button id="add-btn" hidden title="Ouvrir une autre session dans ce dossier">+ Session</button>
    <button id="close-btn" hidden title="Arrêter claude et Neovim de cette session et retirer sa carte">Fermer</button>
    <button id="close-chantier-btn" hidden title="Supprimer le worktree et la branche de ce chantier (refusé s'il reste une session, des fichiers modifiés ou une branche non fusionnée)">Clore le chantier</button>
    <button id="resume-btn" hidden title="Reprendre une session passée de ce projet">Reprendre…</button>
    <button id="toggle-term" aria-expanded="false" hidden>Terminal</button>
    <button id="layout" hidden title="Placer Neovim sous la conversation ou à sa droite">Neovim à droite</button>
    <button id="interrupt" disabled hidden title="Envoie Échap à claude (interrompt le tour en cours)">Interrompre</button>
    <span id="state" title="état de la session"></span>
    <span id="model" title="Modèle utilisé par cette session" hidden></span>
    <span id="status"></span>
    <button id="notif" hidden title="Notification système et bip quand une session attend ta réponse">Activer les notifications</button>
  </header>
  <div id="offline" role="alert" hidden>Serveur arrêté (fenêtre de la régie fermée ?) : plus rien ne se met à jour. Relance la régie depuis le raccourci du Bureau.</div>
  <dialog id="cand-dlg"></dialog>
  <main id="dash"></main>
  <div id="sess" hidden>
    <div id="work">
      <div id="picker" hidden></div>
      <div id="conv"></div>
      <div id="side">
        <div id="statusline" title="Barre de statut de claude (ta statusLine)" hidden></div>
        <div id="nvim"><div id="nvim-term"></div></div>
      </div>
    </div>
    <div id="drawer"><div id="term"></div></div>
  </div>
  <script src="/vendor/xterm/lib/xterm.js"></script>
  <script src="/vendor/addon-fit/lib/addon-fit.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
